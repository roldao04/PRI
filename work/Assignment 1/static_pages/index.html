<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Busca Sapien</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🔍 Motor de Busca Sapien</h1>
            <p class="subtitle">Sistema de Recuperação de Informação com BM25</p>
        </header>

        <!-- Statistics -->
        <div class="statistics">
            <div id="stats" class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value">...</div>
                    <div class="stat-label">A carregar...</div>
                </div>
            </div>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Pesquisar documentos..."
                class="search-input"
            >
            <button onclick="performSearch()" id="searchButton" class="search-button">
                🔍 Pesquisar
            </button>
        </div>

        <!-- Advanced Options -->
        <div class="advanced-options">
            <button onclick="toggleAdvancedOptions()" id="toggleAdvanced" class="toggle-button">
                ⚙️ Opções Avançadas
            </button>
            <div id="advancedPanel" class="advanced-panel hidden">
                <div class="option-group">
                    <label for="numResults">Número de Resultados:</label>
                    <input type="number" id="numResults" value="10" min="1" max="100">
                </div>
                <div class="option-group">
                    <label for="k1Param">Parâmetro k1 (BM25):</label>
                    <input type="number" id="k1Param" value="1.2" min="0" max="3" step="0.1">
                </div>
                <div class="option-group">
                    <label for="bParam">Parâmetro b (BM25):</label>
                    <input type="number" id="bParam" value="0.75" min="0" max="1" step="0.05">
                </div>
                <div class="option-group">
                    <label for="minScore">Score Mínimo:</label>
                    <input type="number" id="minScore" value="0.0" min="0" step="0.1">
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>A pesquisar...</p>
        </div>

        <!-- Search Info -->
        <div id="searchInfo" class="search-info hidden"></div>

        <!-- Results -->
        <div id="results" class="results-container"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
